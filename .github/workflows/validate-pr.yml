name: Pull Request validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the proposed change
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install package dependencies
        run: npm ci
      - name: Install Claude demo workspace
        run: npm --prefix claude-demo ci
      - name: Validate the repository
        run: npm run check
      - name: Validate the deployable Claude demo
        run: npm --prefix claude-demo run check
